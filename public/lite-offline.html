<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07111f">
  <title>الأرشيف لايت - بدون اتصال</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07111f;color:#f8fafc;font-family:Cairo,Tajawal,Tahoma,Arial,sans-serif;padding:24px}
    main{max-width:420px;text-align:center;background:#0f1b2d;border:1px solid rgba(148,163,184,.2);border-radius:24px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
    .icon{font-size:52px;margin-bottom:12px}.muted{color:#9fb0c8;line-height:1.9}
    button{border:0;border-radius:14px;padding:12px 18px;background:#3b82f6;color:#fff;font-family:inherit;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
<main>
  <div class="icon">📡</div>
  <h1>لا يوجد اتصال</h1>
  <p class="muted">تعذر الاتصال بخادم الأرشيف حالياً. عند عودة الاتصال يمكنك إعادة المحاولة.</p>
  <button onclick="location.reload()">إعادة المحاولة</button>
</main>
</body>
</html>
